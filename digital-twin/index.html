<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>ASV Swarm DT — 海域デジタルツイン（センサー実証）</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06121a; color: #d7e6ea; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #app { position: relative; width: 100%; height: 100%; }
    #scene-canvas { display: block; width: 100%; height: 100%; }
    #hud { position: absolute; top: 12px; left: 12px; display: flex; gap: 12px; }
    .panel { background: rgba(6, 18, 26, 0.85); border: 1px solid #23444f; border-radius: 4px; padding: 8px 10px; font-size: 12px; width: 180px; }
    .panel h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #6fb3c7; }
    #panel-camera { width: 220px; }
    #panel-camera img { display: block; width: 100%; border-radius: 2px; }
    #caption { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: #6fb3c7; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="scene-canvas"></canvas>
    <div id="hud">
      <div class="panel" id="panel-camera"><h3>Camera</h3><div id="camera-readout">(起動中)</div></div>
      <div class="panel" id="panel-radar"><h3>Radar</h3><div id="radar-readout">—</div></div>
      <div class="panel" id="panel-gnss"><h3>GNSS</h3><div id="gnss-readout">—</div></div>
    </div>
    <div id="caption">海域デジタルツイン（センサー実証デモ） — デフォルトシナリオ: 東京湾（core/scenarios/tokyo_bay_minimal.json）</div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.165.0/build/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
