<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>ASV Swarm DT — 記録済みエピソード再生ビュアー</title>
  <style>
    html, body { margin: 0; height: 100%; background: #06121a; color: #d7e6ea; font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }

    #topbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 8px 12px; background: #0b1b24; border-bottom: 1px solid #1c3540;
    }
    #topbar h1 { font-size: 14px; font-weight: 700; color: #6fb3c7; margin: 0 16px 0 0; letter-spacing: .03em; }
    .file-field { display: flex; flex-direction: column; font-size: 10px; color: #6fb3c7; }
    .file-field input[type=file] { font-size: 11px; color: #9fc3ff; max-width: 190px; }
    #topbar select, #topbar button {
      background: #122234; color: #d7e6ea; border: 1px solid #24425f; border-radius: 4px;
      padding: 5px 9px; font-size: 12px; cursor: pointer;
    }
    #topbar button:hover, #topbar select:hover { border-color: #4ea3e0; }
    #status { font-size: 11px; color: #8fa8bf; margin-left: auto; max-width: 360px; }

    #transport {
      display: flex; align-items: center; gap: 10px; padding: 6px 12px;
      background: #0b1b24; border-bottom: 1px solid #1c3540; font-size: 12px;
    }
    #transport input[type=range] { flex: 1; }
    #outcome-badge {
      font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px;
      border: 1px solid #333; display: none;
    }
    #outcome-badge.defended { display: inline-block; color: #7be08a; border-color: #1d5745; background: #12352a; }
    #outcome-badge.breached { display: inline-block; color: #e0708e; border-color: #6b1d33; background: #33121e; }
    #outcome-badge.timeout  { display: inline-block; color: #ffd678; border-color: #5c4a1d; background: #33290f; }

    #panes { position: relative; flex: 1; display: flex; min-height: 0; }
    .pane { position: relative; flex: 1; border-right: 1px solid #1c3540; min-width: 0; }
    .pane:last-child { border-right: none; }
    .pane-label {
      position: absolute; top: 8px; left: 10px; z-index: 2; font-size: 11px; letter-spacing: .08em;
      text-transform: uppercase; color: #6fb3c7; background: rgba(6,18,26,0.7); padding: 2px 7px; border-radius: 3px;
    }
    #canvas-2d, #canvas-3d { display: block; width: 100%; height: 100%; background: #0e1b1f; }

    #conv-pane { flex: 0 0 360px; display: flex; flex-direction: column; background: #0a161d; }
    #conv-detail-toggle {
      position: absolute; top: 8px; right: 10px; z-index: 2; font-size: 10.5px; color: #6fb3c7;
      display: flex; align-items: center; gap: 4px; cursor: pointer;
    }
    #conv-entries {
      flex: 1; overflow-y: auto; padding: 30px 10px 10px; font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
    #conv-entries > div { padding: 2px 4px; border-radius: 3px; }
    #conv-entries > div:hover { background: #122234; }
    .conv-window { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #16283c; }
    .conv-override { padding-left: 14px; opacity: 0.95; }
    .conv-obey-summary { padding-left: 14px; opacity: 0.55; font-size: 10.5px; }

    #empty-hint {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 20px; color: #4a6178; font-size: 13px; line-height: 1.7;
      pointer-events: none; /* 説明テキストなので操作を奪わない。#panesにposition:relativeが無いと
        containing blockがビューポート全体になり、この透明オーバーレイが上部のボタンごと
        クリックを吸収してしまう不具合があった（実測: 実際のマウスクリックでのみ再現し、
        JSからのelement.click()呼び出しでは再現しないため見落としやすい） */
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <h1>記録済みエピソード再生ビュアー</h1>
      <label class="file-field">位置ログ（必須・*.jsonl）
        <input type="file" id="file-positions" accept=".jsonl,.json,.log,text/plain" />
      </label>
      <label class="file-field">指令ログ（任意・decisions.jsonl）
        <input type="file" id="file-decisions" accept=".jsonl,.json,.log,text/plain" />
      </label>
      <label class="file-field">艇LLM生ログ（任意・calls.jsonl）
        <input type="file" id="file-calls" accept=".jsonl,.json,.log,text/plain" />
      </label>
      <button id="btn-load-default" title="サーバー経由（npx serve等）で開いている場合のみ動作します">既定ログを読込</button>
      <select id="episode-select" disabled><option>エピソード未読み込み</option></select>
      <select id="focus-select" disabled title="3Dカメラが後ろから追従する艇"><option>追従艇未選択</option></select>
      <span id="status"></span>
    </div>

    <div id="transport">
      <button id="btn-playpause" disabled>▶ 再生</button>
      <select id="speed-select">
        <option value="1">1x</option>
        <option value="3">3x</option>
        <option value="5" selected>5x</option>
        <option value="10">10x</option>
        <option value="30">30x</option>
      </select>
      <input type="range" id="seek" min="0" max="1" step="0.1" value="0" disabled />
      <span id="time-readout">t=0.0 / 0.0s</span>
      <span id="outcome-badge"></span>
    </div>

    <div id="panes">
      <div class="pane" id="pane-2d">
        <div class="pane-label">2D 俯瞰マップ</div>
        <canvas id="canvas-2d"></canvas>
      </div>
      <div class="pane" id="pane-3d">
        <div class="pane-label">3D 海域デジタルツイン</div>
        <canvas id="canvas-3d"></canvas>
      </div>
      <div class="pane" id="conv-pane">
        <div class="pane-label">指揮官・艇AIの判断ログ</div>
        <label id="conv-detail-toggle"><input type="checkbox" id="conv-detail-checkbox" /> 詳細（全ログ）を表示</label>
        <div id="conv-entries"></div>
      </div>
      <div id="empty-hint">
        左上で位置ログ（headless_run.js --out で出力したJSONL）を選ぶと再生できます。<br>
        指令ログ・艇LLM生ログも合わせて選ぶと、右側に判断内容が表示されます。
      </div>
    </div>
    <div id="boot-error" style="display:none; position:fixed; left:12px; right:12px; bottom:12px; z-index:99; background:#33121e; border:1px solid #6b1d33; color:#ffb0c2; padding:10px 14px; border-radius:6px; font-size:12px; white-space:pre-wrap;"></div>
  </div>

  <script>
    // main.js（type=module）は1つでもimportが失敗すると全体が実行されず、
    // 開発者ツールを開かない限り「ボタンが無反応」としか見えない。
    // ここは通常のscript（module未使用）なので、main.jsが丸ごと死んでも必ず動く。
    // main.jsの末尾でwindow.__replayViewerReady=trueが立つはずなので、数秒後も
    // 立っていなければ「起動に失敗している」と画面に出す。
    window.addEventListener('error', (e) => showBootError('スクリプトエラー: ' + (e.message || e.error)));
    window.addEventListener('unhandledrejection', (e) => showBootError('未処理のPromiseエラー: ' + (e.reason?.message || e.reason)));
    function showBootError(text) {
      const el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = (el.textContent ? el.textContent + '\n' : '') + text;
    }
    setTimeout(() => {
      if (!window.__replayViewerReady) {
        showBootError(
          'main.js の初期化が完了していません（3秒経過）。上に赤いエラーが出ていなければ、' +
          'ブラウザのキャッシュが古い可能性があります。ハードリロード（Mac: Cmd+Shift+R）を試してください。'
        );
      }
    }, 3000);
  </script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <!--
    digital-twin/index.htmlはThree.jsをCDN（unpkg.com）から読み込む方針（CLAUDE.md参照・
    GitHub Pagesでの公開デモとして外部CDN依存を許容している）。
    こちらのreplay-viewerは手元/GPUクラスタでのSSHポート転送越しに見ることが多く、
    ブラウザ側のネットワーク環境（VPN・プロキシ等）がunpkg.comへ到達できないケースを
    実際に踏んだため、このページだけThree.js本体をvendor/に同梱しCDN依存を無くしている。
  -->
  <script type="module" src="./main.js"></script>
</body>
</html>
