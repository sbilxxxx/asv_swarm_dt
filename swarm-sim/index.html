<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>ASV Swarm DT — 2Dバードビュー戦術マップ</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1416; color: #d7e6ea; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #app { display: flex; height: 100%; }
    /* canvasは置換要素の内在サイズ（デフォルト300x150）がflex-basisの計算に混ざり込み、
       レイアウトが循環的におかしくなることがあるため、min-width:0のラッパーで切り離す */
    #map-wrap { flex: 1 1 auto; min-width: 0; min-height: 0; position: relative; }
    #map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #0e1b1f; display: block; }
    #log-panel { width: 280px; flex: 0 0 auto; border-left: 1px solid #23444f; padding: 10px; font-size: 11px; overflow-y: auto; }
    #log-panel h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #6fb3c7; }
    #log-entries div { padding: 2px 0; border-bottom: 1px solid #17262a; font-family: "SFMono-Regular", Consolas, monospace; }

    /* エピソードHUD: 何ターン目・何秒目・勝敗タリーを常時表示する（優先度4の見た目側） */
    #hud {
      position: absolute; top: 0; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; gap: 16px;
      padding: 6px 12px;
      background: rgba(11, 20, 22, 0.72);
      border-bottom: 1px solid #23444f;
      font-size: 12px;
      font-family: "SFMono-Regular", Consolas, monospace;
    }
    #hud .hud-label { color: #6fb3c7; }
    #hud-tally { color: #d7e6ea; }
    #hud-mode { color: #8fa8a4; }
    /* 実行状態（進行中／推論待ち／不成立）。シムが止まっているのか壊れたのかを
       ここだけ見て判別できるようにする（docs/time-model.md §9 ブラウザ側の停止） */
    #hud-status { color: #7be08a; }
    #hud-status.status-waiting { color: #9fc3ff; }
    #hud-status.status-missed { color: #ff9d5c; }
    #download-log-btn {
      margin-left: auto;
      background: #16323a; color: #d7e6ea; border: 1px solid #2c5866;
      border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer;
      font-family: inherit;
    }
    #download-log-btn:hover { background: #1d4552; }

    /* エピソード終了時の結果バナー。env.step()のdoneをView側でwall-timeのポーズとして演出する */
    #outcome-banner {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 700; letter-spacing: .08em;
      background: rgba(11, 20, 22, 0.55);
      pointer-events: none;
    }
    #outcome-banner.hidden { display: none; }

    /* 推論待ちオーバーレイ: blockedAt()が非空の間、シム時刻は止まる（docs/time-model.md §9）。
       止まっていること・止めている指揮官・実時間の経過を明示し、「固まった／落ちた」と
       見分けが付かない状態を作らない。経過秒数は毎フレーム更新されるので、
       数字が動いていること自体がページが生きている証拠になる。 */
    #wait-overlay {
      position: absolute; top: 44px; left: 50%; transform: translateX(-50%); z-index: 4;
      padding: 8px 14px; border: 1px solid #4a76a8; border-radius: 6px;
      background: rgba(26, 42, 68, 0.92); color: #9fc3ff;
      font: 12px "SFMono-Regular", Consolas, monospace; line-height: 1.5; text-align: center;
      animation: wait-pulse 1.1s ease-in-out infinite alternate;
      pointer-events: none;
    }
    #wait-overlay.hidden { display: none; }
    #wait-overlay .wait-title { font-weight: 700; letter-spacing: .04em; }
    #wait-overlay .wait-detail { color: #6fb3c7; }
    @keyframes wait-pulse { from { opacity: .65; } to { opacity: 1; } }
    #outcome-banner.outcome-defended { color: #4fb8d6; }
    #outcome-banner.outcome-breached { color: #e0708e; }
    #outcome-banner.outcome-timeout { color: #ffd678; }
  </style>
</head>
<body>
  <div id="app">
    <div id="map-wrap">
      <canvas id="map-canvas"></canvas>
      <div id="hud">
        <span id="hud-episode" class="hud-label">Episode 1</span>
        <span id="hud-clock">t=0.0s</span>
        <span id="hud-tally">防衛 0 / 突破 0 / 時間切れ 0</span>
        <span id="hud-mode">blue=scripted red=scripted</span>
        <span id="hud-status">進行中</span>
        <button id="download-log-btn" type="button">ログDL (.jsonl)</button>
      </div>
      <div id="wait-overlay" class="hidden">
        <div class="wait-title">指揮官の推論待ち — シムを停止中</div>
        <div class="wait-detail" id="wait-detail"></div>
        <div class="wait-detail" id="wait-elapsed"></div>
      </div>
      <div id="outcome-banner" class="hidden"></div>
    </div>
    <div id="log-panel">
      <h3>Command Log</h3>
      <div id="log-entries"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
